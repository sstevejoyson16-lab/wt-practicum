
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agriculture Toggle</title>
    <link rel="stylesheet" href="wt15.css">
</head>
<body>

    <div class="container">
        <h1>🌱 Smart Agriculture System</h1>
        <p>Control your IoT-based irrigation system.</p>

        <div class="control-box">
            <h2>Automatic Irrigation</h2>

            <label class="switch">
                <input type="checkbox" id="irrigationToggle">
                <span class="slider"></span>
            </label>

            <p id="status">Irrigation is OFF</p>
            <p id="message">
                Water supply is currently disabled.
            </p>
        </div>

        <div class="info">
            <h3>Smart Farming Solutions</h3>
            <p>Monitor soil moisture and control water usage
               through an automated irrigation system.</p>
        </div>
    </div>

    <script src="wt15.js"></script>
</body>
</html>
