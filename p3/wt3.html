<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTech IoT Solutions</title>
     <link rel="stylesheet" href="wt4.css">
</head>

<body>

    <h1>AgriTech IoT Solutions</h1>

    <p>
        Register your farm to explore IoT-based agriculture solutions
        such as smart irrigation, soil monitoring and crop monitoring.
    </p>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Farmer Information</legend>

            <label for="name">Full Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your full name"
                   required
                   minlength="3"
                   maxlength="50">
            <br><br>

            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@gmail.com"
                   required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Minimum 8 characters"
                   required
                   minlength="8">
            <br><br>

            <label for="phone">Mobile Number:</label>
            <input type="number"
                   id="phone"
                   name="phone"
                   placeholder="Enter mobile number"
                   required
                   min="1000000000"
                   max="9999999999">
            <br><br>

        </fieldset>

        <br>

        <fieldset>
            <legend>Farm Details</legend>

            <label for="farmSize">Farm Size (in acres):</label>
            <input type="number"
                   id="farmSize"
                   name="farmSize"
                   min="0.1"
                   max="10000"
                   step="0.1"
                   placeholder="Example: 5.5"
                   required>
            <br><br>

            <label for="date">Preferred Installation Date:</label>
            <input type="date"
                   id="date"
                   name="installationDate"
                   required>
            <br><br>

            <label for="crop">Primary Crop:</label>
            <select id="crop" name="crop" required>
                <option value="">-- Select Crop --</option>
                <option value="rice">Rice</option>
                <option value="wheat">Wheat</option>
                <option value="cotton">Cotton</option>
                <option value="sugarcane">Sugarcane</option>
                <option value="vegetables">Vegetables</option>
                <option value="fruits">Fruits</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <p>Irrigation Method:</p>

            <input type="radio"
                   id="drip"
                   name="irrigation"
                   value="drip"
                   required>
            <label for="drip">Drip</label>

            <input type="radio"
                   id="sprinkler"
                   name="irrigation"
                   value="sprinkler">
            <label for="sprinkler">Sprinkler</label>

            <input type="radio"
                   id="flood"
                   name="irrigation"
                   value="flood">
            <label for="flood">Flood</label>

            <input type="radio"
                   id="other"
                   name="irrigation"
                   value="other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>IoT Solutions Required</legend>

            <input type="checkbox"
                   id="soil"
                   name="solutions"
                   value="soil">
            <label for="soil">Soil Moisture Monitoring</label>
            <br>

            <input type="checkbox"
                   id="weather"
                   name="solutions"
                   value="weather">
            <label for="weather">Weather Monitoring</label>
            <br>

            <input type="checkbox"
                   id="irrigation"
                   name="solutions"
                   value="irrigation">
            <label for="irrigation">Smart Irrigation</label>
            <br>

            <input type="checkbox"
                   id="cropMonitoring"
                   name="solutions"
                   value="crop">
            <label for="cropMonitoring">Crop Health Monitoring</label>
            <br>

            <input type="checkbox"
                   id="livestock"
                   name="solutions"
                   value="livestock">
            <label for="livestock">Livestock Monitoring</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="requirements">
                Describe Your Farm Requirements:
            </label>
            <br>

            <textarea id="requirements"
                      name="requirements"
                      rows="6"
                      cols="50"
                      maxlength="500"
                      placeholder="Enter your requirements here..."></textarea>
            <br><br>

            <label for="document">Upload Farm Document:</label>
            <input type="file"
                   id="document"
                   name="document"
                   accept=".pdf,.jpg,.jpeg,.png">
            <br><br>

            <input type="checkbox"
                   id="terms"
                   name="terms"
                   value="accepted"
                   required>
            <label for="terms">
                I agree to the terms and conditions.
            </label>

        </fieldset>

        <br>

        <input type="submit" value="Register for IoT Solutions">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
